# Weekly dependency updates, grouped so each ecosystem is one pull request. Security fixes come as soon as
# they're published. See docs/RELEASING.md "Dependencies".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      app:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /hub
    schedule: { interval: weekly }
    groups:
      hub:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    groups:
      rust:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /hub
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
