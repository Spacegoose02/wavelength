# Weekly dependency updates, grouped so each ecosystem is one pull request. Security fixes come as soon as
# they're published. See docs/RELEASING.md "Dependencies".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # @types/node follows the Node version we run (22), not the newest Node
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      app:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /hub
    schedule: { interval: weekly }
    # @types/node follows the Node version we run (22), not the newest Node
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      hub:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    groups:
      rust:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /hub
    schedule: { interval: weekly }
    # stay on Node LTS: odd-numbered majors are short-lived, so major Node moves are done by hand
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
