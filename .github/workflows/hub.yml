# Tests the Wavelength Hub on every change to hub/, and publishes its Docker image from main. The image also
# carries the app's web build (served at /), so app changes rebuild it too.
#
# The image is scanned with Trivy for known vulnerabilities that have a fix (the weekly run fails on
# high/critical ones, pull requests only report them).
#
# Image: ghcr.io/spacegoose02/wavelength-hub (:latest and :sha-<commit>). The first time it's published,
# make the package public (GitHub → your profile → Packages → wavelength-hub → Package settings) so
# Unraid can pull it without logging in. See docs/HUB.md.
name: Hub

on:
  pull_request:
    paths: ['hub/**', 'src/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', '.github/workflows/hub.yml']
  push:
    branches: [main]
    paths: ['hub/**', 'src/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', '.github/workflows/hub.yml']
  # Weekly rebuild: picks up a fresh yt-dlp and Alpine security fixes, and scans the image for new advisories
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      # The tag editor's tests write real audio files with ffmpeg, as the image does. A static build from
      # GitHub releases first (no Ubuntu mirror involved: an unreachable security.ubuntu.com once hung this step
      # for 20+ minutes and blocked a release), then apt with short timeouts and retries as a fallback.
      - name: Install ffmpeg
        timeout-minutes: 15
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          if curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | tar -xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'; then
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ffmpeg/ffmpeg" -hide_banner -version | head -1
            exit 0
          fi
          echo "::warning::static ffmpeg download failed, falling back to apt"
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          for i in 1 2 3; do
            timeout 90 sudo apt-get $APT update -q && timeout 180 sudo apt-get $APT install -y -qq ffmpeg && exit 0
            echo "::warning::apt attempt $i failed, retrying"; sleep $((i * 15))
          done
          exit 1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    # two-platform build under QEMU; cached runs take a few minutes, cold ones much longer
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One platform, loaded locally, for the vulnerability scan
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64
          load: true
          tags: wavelength-hub:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned: a scanner sees the whole image
        with:
          image-ref: wavelength-hub:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: ${{ github.event_name == 'schedule' && '1' || '0' }}
      # Pull requests only build the image (to catch Dockerfile breakage); main also pushes it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/spacegoose02/wavelength-hub:latest
            ghcr.io/spacegoose02/wavelength-hub:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
