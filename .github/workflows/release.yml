# Builds the Windows installer/exe and the signed Android APK and attaches them to a GitHub release.
#
# Runs when a release is published, or by hand (Actions → Release builds → Run workflow) for a tag
# that already has a release, e.g. to (re)attach binaries to an older release.
#
# The version is taken from the tag (v0.7.0 → 0.7.0) and written into package.json and
# tauri.conf.json before building, so the installer name and Android versionCode always match the tag.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of src-tauri/gen/android/wavelength-release.jks
#   ANDROID_KEYSTORE_PASSWORD storePassword from keystore.properties
#   ANDROID_KEY_ALIAS         keyAlias from keystore.properties (normally "wavelength")
#   ANDROID_KEY_PASSWORD      keyPassword from keystore.properties
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to (e.g. v0.7.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Release certificate; an APK signed with anything else can't update existing installs.
  RELEASE_CERT_SHA256: 22530aa081ae26e241d328bd4e97dfe919f2a86c995e9e4e4dcb96610c985a31
  NDK_VERSION: 28.2.13676358

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Keep the runner's user folder out of paths Rust embeds in the binary (see docs/RELEASING.md)
      CARGO_HOME: C:\cargo-home
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        shell: bash
        run: |
          # Inline (not a script file) so it also works when building older tags.
          node -e '
            const fs = require("fs"), v = process.argv[1];
            if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error("Bad version: " + v); process.exit(1); }
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              console.log(f + ": " + j.version + " -> " + v);
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "${TAG#v}"

      - run: npm ci

      - name: Build
        run: npm run tauri build

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${TAG#v}"
          gh release upload "$TAG" --clobber \
            "src-tauri/target/release/bundle/nsis/Wavelength_${V}_x64-setup.exe" \
            "src-tauri/target/release/Wavelength.exe"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Android signing secrets are missing. See the header of .github/workflows/release.yml and docs/RELEASING.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the legacy 'tools' package, which newer
          # cmdline-tools no longer provide (sdkmanager fails with exit code 1).
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        shell: bash
        run: |
          # Inline (not a script file) so it also works when building older tags.
          node -e '
            const fs = require("fs"), v = process.argv[1];
            if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error("Bad version: " + v); process.exit(1); }
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              console.log(f + ": " + j.version + " -> " + v);
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "${TAG#v}"

      - run: npm ci

      - name: Write signing config
        working-directory: src-tauri/gen/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > wavelength-release.jks
          {
            echo "storeFile=wavelength-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: Build
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Verify signature and upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${TAG#v}"
          APK="Wavelength-${V}-android.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          if ! echo "$CERTS" | grep -qi "SHA-256 digest: ${RELEASE_CERT_SHA256}"; then
            echo "::error::APK is not signed with the release certificate (${RELEASE_CERT_SHA256})."
            exit 1
          fi
          gh release upload "$TAG" --clobber "$APK"

      - name: Remove signing files
        if: always()
        working-directory: src-tauri/gen/android
        run: rm -f wavelength-release.jks keystore.properties
