# Builds the Windows installer/exe, the Linux AppImage and .deb, the Mac .dmg (and the .app.tar.gz it updates from) and the signed Android APK and attaches them to a GitHub release.
#
# Runs when a release is published, or by hand (Actions → Release builds → Run workflow) for a tag
# that already has a release, e.g. to (re)attach binaries to an older release.
#
# The version is taken from the tag (v0.7.0 → 0.7.0) and written into package.json and
# tauri.conf.json before building, so the installer name and Android versionCode always match the tag.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of src-tauri/gen/android/wavelength-release.jks
#   ANDROID_KEYSTORE_PASSWORD storePassword from keystore.properties
#   ANDROID_KEY_ALIAS         keyAlias from keystore.properties (normally "wavelength")
#   ANDROID_KEY_PASSWORD      keyPassword from keystore.properties
# Optional, for signed and notarised Mac builds (without them the .dmg is unsigned; see docs/RELEASING.md "Mac"):
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
# Optional, for update signing (docs/RELEASING.md "Update signing"):
#   TAURI_SIGNING_PRIVATE_KEY           private key from `npx tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to (e.g. v0.7.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Release certificate; an APK signed with anything else can't update existing installs.
  RELEASE_CERT_SHA256: 22530aa081ae26e241d328bd4e97dfe919f2a86c995e9e4e4dcb96610c985a31
  NDK_VERSION: 28.2.13676358

jobs:
  windows:
    runs-on: windows-latest
    # well above a cold build, far below the 6-hour default, so a hung step is caught
    timeout-minutes: 90
    env:
      # Keep the runner's user folder out of paths Rust embeds in the binary (see docs/RELEASING.md)
      CARGO_HOME: C:\cargo-home
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        shell: bash
        run: |
          # Inline (not a script file) so it also works when building older tags.
          node -e '
            const fs = require("fs"), v = process.argv[1];
            if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error("Bad version: " + v); process.exit(1); }
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              console.log(f + ": " + j.version + " -> " + v);
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "${TAG#v}"

      - run: npm ci

      - name: Build
        run: npm run tauri build

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          V="${TAG#v}"
          FILES=("src-tauri/target/release/bundle/nsis/Wavelength_${V}_x64-setup.exe" "src-tauri/target/release/Wavelength.exe")
          # Apps with a key in src-tauri/update-key.pub only install updates that carry a matching .sig
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for f in "${FILES[@]}"; do npx tauri signer sign "$f"; FILES+=("$f.sig"); done
          fi
          gh release upload "$TAG" --clobber "${FILES[@]}"

  linux:
    runs-on: ubuntu-22.04
    # well above a cold build, far below the 6-hour default, so a hung step is caught
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Short apt timeouts and retries so a flaky Ubuntu mirror fails or recovers in minutes instead of hanging
      - name: System libraries
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          for i in 1 2 3; do
            timeout 90 sudo apt-get $APT update -q && timeout 180 sudo apt-get $APT install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev patchelf && exit 0
            echo "::warning::apt attempt $i failed, retrying"; sleep $((i * 15))
          done
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        shell: bash
        run: |
          # Inline (not a script file) so it also works when building older tags.
          node -e '
            const fs = require("fs"), v = process.argv[1];
            if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error("Bad version: " + v); process.exit(1); }
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              console.log(f + ": " + j.version + " -> " + v);
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "${TAG#v}"

      - run: npm ci

      - name: Build
        run: npm run tauri build -- --bundles appimage deb

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          FILES=(src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb)
          # the AppImage updates itself (src-tauri/src/update.rs), so it carries a .sig like the Windows files
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for f in src-tauri/target/release/bundle/appimage/*.AppImage; do npx tauri signer sign "$f"; FILES+=("$f.sig"); done
          fi
          gh release upload "$TAG" --clobber "${FILES[@]}"

  macos:
    runs-on: macos-latest
    # well above a cold build, far below the 6-hour default, so a hung step is caught
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        shell: bash
        run: |
          # Inline (not a script file) so it also works when building older tags.
          node -e '
            const fs = require("fs"), v = process.argv[1];
            if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error("Bad version: " + v); process.exit(1); }
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              console.log(f + ": " + j.version + " -> " + v);
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "${TAG#v}"

      - run: npm ci

      # Tauri signs and notarises when the APPLE_* variables are set; without them the app is unsigned
      # (right-click → Open). A missing secret still arrives as an empty variable, which Tauri treats as
      # "set" and then fails to import, so they're only exported when the certificate is really there.
      - name: Apple signing (only when the secrets are set)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate: building an unsigned .dmg"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              d="EOF_$(openssl rand -hex 8)"
              { echo "$v<<$d"; echo "${!v}"; echo "$d"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build (universal, Apple silicon and Intel)
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle
          # Wavelength.app as a .tar.gz: what the Mac app updates itself from (src-tauri/src/update.rs)
          UPD="$B/macos/Wavelength_${TAG#v}_universal.app.tar.gz"
          tar -czf "$UPD" -C "$B/macos" Wavelength.app
          FILES=("$B"/dmg/*.dmg "$UPD")
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri signer sign "$UPD"; FILES+=("$UPD.sig")
          fi
          gh release upload "$TAG" --clobber "${FILES[@]}"

  ios:
    # The iPhone app (docs/IOS.md). Needs an Apple Developer account: without its secrets this job is skipped.
    runs-on: macos-latest
    # well above a cold build, far below the 6-hour default, so a hung step is caught
    timeout-minutes: 90
    steps:
      - name: Check Apple secrets
        id: secrets
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$TEAM" ]; then
            echo "::notice::No Apple App Store Connect secrets, so no iPhone build. See docs/IOS.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.secrets.outputs.ok == 'true'
        with:
          targets: aarch64-apple-ios

      - name: Set version from tag
        if: steps.secrets.outputs.ok == 'true'
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), v = process.argv[1];
            if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error("Bad version: " + v); process.exit(1); }
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "${TAG#v}"

      - name: Build for the App Store (TestFlight)
        if: steps.secrets.outputs.ok == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8
          export APPLE_API_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8
          # gen/apple isn't kept in the repo: make the Xcode project, then build and sign with automatic provisioning
          npm run tauri ios init -- --ci
          npm run tauri ios build -- --export-method app-store-connect --ci

      - name: Upload to TestFlight
        if: steps.secrets.outputs.ok == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app --type ios --file src-tauri/gen/apple/build/arm64/*.ipa \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

  android:
    runs-on: ubuntu-latest
    # well above a cold build, far below the 6-hour default, so a hung step is caught
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Android signing secrets are missing. See the header of .github/workflows/release.yml and docs/RELEASING.md."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          # The default list includes the legacy 'tools' package, which newer
          # cmdline-tools no longer provide (sdkmanager fails with exit code 1).
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        shell: bash
        run: |
          # Inline (not a script file) so it also works when building older tags.
          node -e '
            const fs = require("fs"), v = process.argv[1];
            if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error("Bad version: " + v); process.exit(1); }
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              console.log(f + ": " + j.version + " -> " + v);
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "${TAG#v}"

      - run: npm ci

      - name: Write signing config
        working-directory: src-tauri/gen/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > wavelength-release.jks
          {
            echo "storeFile=wavelength-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: Build
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Verify signature and upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          V="${TAG#v}"
          APK="Wavelength-${V}-android.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          if ! echo "$CERTS" | grep -qi "SHA-256 digest: ${RELEASE_CERT_SHA256}"; then
            echo "::error::APK is not signed with the release certificate (${RELEASE_CERT_SHA256})."
            exit 1
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri signer sign "$APK"
            gh release upload "$TAG" --clobber "$APK" "$APK.sig"
          else
            gh release upload "$TAG" --clobber "$APK"
          fi

      - name: Remove signing files
        if: always()
        working-directory: src-tauri/gen/android
        run: rm -f wavelength-release.jks keystore.properties
