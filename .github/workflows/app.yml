# Checks the app on every pull request and push to main: TypeScript, the Rust shell (tests + clippy), and
# known vulnerabilities in npm and Cargo dependencies. The Hub has its own workflow (hub.yml); releases are
# built by release.yml.
name: App

on:
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'index.html', 'package.json', 'package-lock.json', 'tsconfig.json', 'vite.config.ts', 'biome.json', 'hub/src/**', 'hub/test/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['src/**', 'src-tauri/**', 'index.html', 'package.json', 'package-lock.json', 'tsconfig.json', 'vite.config.ts', 'biome.json', 'hub/src/**', 'hub/test/**', '.github/workflows/app.yml']
  # Weekly, so a newly published advisory shows up even when nothing changed
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Biome (biome.json): hook-order and other bug-class rules for the app and the Hub
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      # Only what ships in the app; dev-server tooling is covered by Dependabot
      - run: npm audit --omit=dev --audit-level=moderate
      # End-to-end smoke test of the browser build (e2e/, playwright.config.ts)
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --trace off

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      # Tauri's Linux build needs WebKitGTK even for `cargo test`. Short apt timeouts and retries so a flaky
      # Ubuntu mirror fails or recovers in minutes instead of hanging the job.
      - name: System libraries
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          for i in 1 2 3; do
            timeout 90 sudo apt-get $APT update -qq && timeout 180 sudo apt-get $APT install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev && exit 0
            echo "::warning::apt attempt $i failed, retrying"; sleep $((i * 15))
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! wants the frontend folder to exist
      - run: mkdir -p ../dist
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  audit-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RUSTSEC-2024-0429 is in glib, which only the Linux (GTK) build uses; Wavelength ships for Windows and Android.
      - run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429
