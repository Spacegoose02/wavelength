# Wavelength Hub next to Navidrome. On Unraid use unraid/wavelength-hub.xml instead. See docs/HUB.md.
services:
  wavelength-hub:
    image: ghcr.io/spacegoose02/wavelength-hub:latest
    container_name: wavelength-hub
    restart: unless-stopped
    ports:
      - "7780:7780"
    environment:
      WAVELENGTH_PUBLIC_URL: https://hub.example.com
      WAVELENGTH_SSO: "true"
      WAVELENGTH_PROXY_SECRET: change-me-to-a-long-random-value
      WAVELENGTH_ADMINS: alex
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./wavelength-hub:/data
      - /path/to/music:/music # yt-dlp downloads go into a folder inside it
  # Optional: start, stop and restart other containers from Settings → Server. See docs/HUB.md "Docker control".
  # Then add to wavelength-hub's environment:
  #   WAVELENGTH_DOCKER_URL: http://docker-socket-proxy:2375
  #   WAVELENGTH_DOCKER_CONTAINERS: navidrome
  # docker-socket-proxy:
  #   image: tecnativa/docker-socket-proxy:latest
  #   container_name: docker-socket-proxy
  #   restart: unless-stopped
  #   environment:
  #     CONTAINERS: "1"
  #     POST: "1"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
