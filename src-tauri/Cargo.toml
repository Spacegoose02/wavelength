[package]
name = "tonearm"
version = "0.1.0"
description = "All-in-one music player for self-hosted libraries"
edition = "2021"

[lib]
name = "tonearm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-http = { version = "2", features = ["cookies"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring-core = "1"
sha2 = "0.11"
base64 = "0.22"
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_NetworkManagement_WNet", "Win32_Foundation"] }
windows-native-keyring-store = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
