[package]
name = "tonearm"
version = "0.1.0"
description = "All-in-one music player for self-hosted libraries"
edition = "2021"

[lib]
name = "tonearm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-http = { version = "2", features = ["cookies", "gzip"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring-core = "1"
sha2 = "0.11"
base64 = "0.23"
minisign-verify = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
mdns-sd = "0.21"
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3", "aac", "isomp4", "alac", "wav", "pcm", "ogg", "vorbis", "aiff"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_WNet", "Win32_Foundation"] }
windows-native-keyring-store = "1"
wasapi = "0.27"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }
